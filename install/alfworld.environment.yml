name: alfworld
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip>=24
  - pip:
      # Python 3.9 cannot install spaCy 3.8's current thinc build.  Jericho
      # leaves this unconstrained, so pin the newest compatible wheel before
      # resolving TextWorld/ALFWorld.
      - "spacy>=3.7,<3.8"
      - "alfworld==0.4.2"
      - "gymnasium>=0.28,<1.0"
      - "numpy<2.0"
      - "pyyaml>=6.0"
      - "requests>=2.28"
      - "httpx>=0.24"
      - "openai>=1.0"
      - "pydantic>=2.0,<3.0"
      - "tqdm>=4.64"
